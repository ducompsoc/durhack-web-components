name: Publish

on:
  release:
    types: [prereleased, released]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: Lordfirespeed/setup-node@v0.1
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org/
          package-managers: pnpm
      - run: pnpm install
      - run: git config --global user.name "${{ github.actor }}"
      - run: git config --global user.email "github-action-${{ github.actor }}@users.noreply.github.com"
      - run: |
          jq '.version = "0.0.0"' package.json > tmp.json
          mv tmp.json package.json
          pnpm version --no-git-tag-version --no-git-checks "${{ github.event.release.tag_name }}"
      - run: |
          npm_tag=latest
          if [[ "${{ github.event.release.tag_name }}" == *-* ]]; then 
            npm_tag=next;
          fi
          pnpm stage publish --access public --no-git-checks --tag "$npm_tag"
